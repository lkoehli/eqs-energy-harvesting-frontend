[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbcbench"
version = "0.1.0"
description = "Bench automation for characterizing the EQS energy-harvesting frontend (Keysight B2902A SMU, Keysight 33600A generator)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lucas Köhli" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
visa = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hbcbench = "hbcbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
